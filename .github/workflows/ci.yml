name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DBT_PROJECT_DIR: src/transform/nba_analytics
  DBT_PROFILES_DIR: src/transform/nba_analytics

jobs:
  test:
    name: Test ingestion and transformation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Cache dbt packages
        uses: actions/cache@v4
        with:
          path: ${{ env.DBT_PROJECT_DIR }}/dbt_packages
          key: dbt-packages-${{ hashFiles(format('{0}/packages.yml', env.DBT_PROJECT_DIR)) }}

      - name: Install dbt packages
        run: |
          uv run dbt deps \
            --project-dir ${{ env.DBT_PROJECT_DIR }} \
            --profiles-dir ${{ env.DBT_PROFILES_DIR }}

      - name: Run ingestion tests
        run: uv run -m pytest tests -v

      - name: Run ingestion (populate DuckDB)
        run: uv run src/ingest/load.py

      - name: Run dbt models
        run: |
          uv run dbt run \
            --project-dir ${{ env.DBT_PROJECT_DIR }} \
            --profiles-dir ${{ env.DBT_PROFILES_DIR }}

      - name: Run dbt tests
        run: |
          uv run dbt test \
            --project-dir ${{ env.DBT_PROJECT_DIR }} \
            --profiles-dir ${{ env.DBT_PROFILES_DIR }}

      # Generate docs and upload as artifact so the docs job can deploy them
      - name: Generate dbt documentation
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          uv run docglow generate \
            --project-dir ${{ env.DBT_PROJECT_DIR }}  \
            --output-dir ./site

      - name: Upload dbt docs artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          # dbt docs generate outputs to target/ inside the project dir
          path: ${{ env.DBT_PROJECT_DIR }}/target

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-docs:
    name: Deploy dbt docs to GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          path: ./site
