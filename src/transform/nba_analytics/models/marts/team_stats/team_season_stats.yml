version: 2

models:
  - name: team_season_stats
    description: "Aggregated team statistics for each season, including performance metrics and rankings."
    config:
      tags:
        - teams
        - seasons
      meta:
        owner: "DATA_ANALYTICS_TEAM"
    columns:
      - name: season_id
        data_type: bigint
        description: "Unique identifier for the NBA season"

      - name: team
        data_type: varchar
        description: "Abbreviation of the team"

      - name: team_name
        data_type: varchar
        description: "Full name of the team"

      - name: season
        data_type: varchar
        description: "NBA season (e.g., '2022-2023')"

      - name: wins
        data_type: bigint
        description: "Number of games won by the team in the season"

      - name: losses
        data_type: bigint
        description: "Number of games lost by the team in the season"

      - name: total_games
        data_type: bigint
        description: "Total number of games played by the team in the season"

      - name: team_fgm
        data_type: double
        description: "Average field goals made by the team per game"

      - name: team_ast
        data_type: double
        description: "Average assists by the team per game"

      - name: team_fg3m
        data_type: double
        description: "Average three-point field goals made by the team per game"

      - name: team_ft_pct
        data_type: double
        description: "Average free throw percentage for the team"

      - name: team_oreb
        data_type: double
        description: "Average offensive rebounds by the team per game"

      - name: team_reb
        data_type: double
        description: "Average total rebounds by the team per game"

      - name: team_fg_pct
        data_type: double
        description: "Average field goal percentage for the team"

      - name: team_fg3_pct
        data_type: double
        description: "Average three-point field goal percentage for the team"

      - name: team_dreb
        data_type: double
        description: "Average defensive rebounds by the team per game"

      - name: team_fg3a
        data_type: double
        description: "Average three-point field goals attempted by the team per game"

      - name: team_fga
        data_type: double
        description: "Average field goals attempted by the team per game"

      - name: team_fta
        data_type: double
        description: "Average free throws attempted by the team per game"

      - name: team_ftm
        data_type: double
        description: "Average free throws made by the team per game"

      - name: team_pts
        data_type: double
        description: "Average points scored by the team per game"

      - name: opponent_fgm
        data_type: double
        description: "Average field goals made by opponents per game"

      - name: opponent_ast
        data_type: double
        description: "Average assists by opponents per game"

      - name: opponent_fg3m
        data_type: double
        description: "Average three-point field goals made by opponents per game"

      - name: opponent_fg_pct
        data_type: double
        description: "Average field goal percentage for opponents"

      - name: opponent_fg3_pct
        data_type: double
        description: "Average three-point field goal percentage for opponents"

      - name: opponent_dreb
        data_type: double
        description: "Average defensive rebounds by opponents per game"

      - name: opponent_pts
        data_type: double
        description: "Average points scored by opponents per game"

      - name: opponent_fg3a
        data_type: double
