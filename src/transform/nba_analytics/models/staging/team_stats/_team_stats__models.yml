version: 2

models:
  - name: base_team_stats__home
    description: "Base stats for NBA teams playing at home, including opponent statistics."
    columns:
      - name: season_id
        data_type: bigint
        description: "Unique identifier for the NBA season"
      - name: game_id
        data_type: varchar
        description: "Unique identifier for the game"
      - name: game_date
        data_type: timestamp
        description: "Date when the game was played"
      - name: game_location
        data_type: varchar
        description: "Location of the game (home or away)"
      - name: win_loss
        data_type: varchar
        description: "Win or loss indicator for the team"
      - name: team
        data_type: varchar
        description: "Abbreviation of the home team"
      - name: team_name
        data_type: varchar
        description: "Full name of the home team"
      - name: opponent
        data_type: varchar
        description: "Abbreviation of the opponent team"
      - name: opponent_name
        data_type: varchar
        description: "Full name of the opponent team"
      - name: team_pts
